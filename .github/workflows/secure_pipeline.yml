name: Secure DevSecOps Supply Chain Pipeline (SLSA Level 4)

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  secure-build:
    name: Build, Scan, Sign & Attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Needed for Cosign OIDC Keyless signing
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run TruffleHog Secrets Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Install Syft (SBOM Generator)
        uses: anchore/sbom-action/download-syft@v0.33.0

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: harbor.internal.fintech
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Build and Push Distroless Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            harbor.internal.fintech/finance/api-service:${{ github.sha }}
            harbor.internal.fintech/finance/api-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate CycloneDX SBOM using Syft
        run: |
          syft harbor.internal.fintech/finance/api-service:${{ github.sha }} \
            -o cyclonedx-json \
            --file sbom.cyclonedx.json

      - name: Scan Image via Trivy (Security Scanner)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: harbor.internal.fintech/finance/api-service:${{ github.sha }}
          format: 'table'
          exit-code: '1' # Fail the build on CRITICAL vulnerabilities
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Scan SBOM via Grype (Vulnerability Matcher)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype sbom.cyclonedx.json --fail-on critical

      - name: Keyless Sign Image with Cosign (Sigstore OIDC)
        run: |
          cosign sign --yes harbor.internal.fintech/finance/api-service:${{ github.sha }}

      - name: Attest SBOM & Build Provenance (in-toto)
        run: |
          cosign attest --yes \
            --predicate sbom.cyclonedx.json \
            --type cyclonedx \
            harbor.internal.fintech/finance/api-service:${{ github.sha }}
